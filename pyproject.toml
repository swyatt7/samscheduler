[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samscheduler"
version = "0.1.0"
description = "A small astronomy observing scheduler"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "astropy>=5.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pydantic>=2.6,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=samscheduler --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["samscheduler"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
